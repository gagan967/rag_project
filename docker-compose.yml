services:
  app:
    image: ${GHCR_IMAGE:-pdf-rag:latest}
    build:
      context: .
    ports:
      - "8501:8501"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env or the environment}
      RAG_DATA_DIR: /app/data
      CHROMA_PATH: /app/data/chroma_db
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - rag_data:/app/data
      - huggingface_cache:/home/app/.cache/huggingface
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rag_data:
  huggingface_cache:
