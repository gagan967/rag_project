name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Configure SSH
        if: github.ref == 'refs/heads/main'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          test -n "$EC2_SSH_KEY" || { echo "EC2_SSH_KEY is required"; exit 1; }
          test -n "$EC2_HOST" || { echo "EC2_HOST is required"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Copy deployment files
        if: github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "$EC2_USER" || { echo "EC2_USER is required"; exit 1; }
          ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" 'mkdir -p ~/pdf-rag'
          scp -i "$HOME/.ssh/deploy_key" docker-compose.yml "$EC2_USER@$EC2_HOST:pdf-rag/docker-compose.yml"
          scp -i "$HOME/.ssh/deploy_key" deploy/deploy.sh "$EC2_USER@$EC2_HOST:pdf-rag/deploy.sh"
      - name: Log in and deploy on EC2
        if: github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_IMAGE: ${{ steps.image.outputs.name }}:latest
        run: |
          remote_docker_config="/tmp/pdf-rag-ghcr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" \
            "install -d -m 700 '$remote_docker_config' && DOCKER_CONFIG='$remote_docker_config' docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" \
            "DOCKER_CONFIG='$remote_docker_config' GHCR_IMAGE='$GHCR_IMAGE' bash ~/pdf-rag/deploy.sh; status=\$?; DOCKER_CONFIG='$remote_docker_config' docker logout ghcr.io >/dev/null 2>&1 || true; rm -f '$remote_docker_config/config.json'; rmdir '$remote_docker_config' 2>/dev/null || true; exit \$status"
